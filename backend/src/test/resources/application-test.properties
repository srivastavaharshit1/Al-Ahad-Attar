spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Root cause of the long-standing "Table ROLE not found" failure: application.yml (base config,
# always loaded) hard-sets spring.jpa.properties.hibernate.dialect=PostgreSQLDialect. Spring Boot
# applies spring.jpa.properties.* on top of/after spring.jpa.database-platform when building
# Hibernate's property map, so a profile that only overrides database-platform (as this one
# previously did) never actually wins — Hibernate kept using PostgreSQLDialect against the H2 test
# database, emitting Postgres-only DDL (e.g. "bigserial" identity columns) that H2 can't parse.
# Every CREATE TABLE silently failed and was logged-and-skipped by Hibernate's schema export,
# cascading into "table not found" for every entity, role included. Fixed by overriding the exact
# same property key the base config sets, which profile-specific documents DO take priority on.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

